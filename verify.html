<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMMYTECH Certificate Verification</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.12);
}

.header{
    text-align:center;
    border-bottom:2px solid #222;
    padding-bottom:20px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:6px 0;
    color:#555;
}

.status{
    text-align:center;
    margin:25px 0;
    padding:15px;
    border-radius:8px;
    font-weight:bold;
}

.valid{
    background:#dff5e3;
    color:#187333;
}

.invalid{
    background:#ffe0e0;
    color:#b00020;
}

.details{
    margin-top:20px;
}

.row{
    display:flex;
    border-bottom:1px solid #ddd;
    padding:12px 5px;
}

.label{
    width:40%;
    font-weight:bold;
}

.value{
    width:60%;
}

.footer{
    margin-top:30px;
    text-align:center;
    font-size:14px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AMMYTECH COMPUTER INSTITUTE</h1>
        <p>Learn • Practice • Grow</p>
        <p>Certificate Verification</p>
    </div>

    <div id="status" class="status">
        Verifying Certificate...
    </div>

    <div id="details" class="details"></div>

    <div class="footer">
        AMMYTECH COMPUTER INSTITUTE<br>
        Ablowal, Back Side Thapar University, Near Fateh Medical Store<br>
        Phone: 9999949313
    </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxkWtUjVU18p57sbaV7x467Nn21lwys_CsaBFIpoPEvfbQUI_TOf86LvRih7qXRBVeKAw/exec";


const params = new URLSearchParams(window.location.search);

const certificateID = params.get("id");

const statusBox = document.getElementById("status");

const detailsBox = document.getElementById("details");


function showDetails(cert){

    detailsBox.innerHTML = `

        <div class="row">
            <div class="label">Certificate No.</div>
            <div class="value">${cert.CertificateNumber || ""}</div>
        </div>

        <div class="row">
            <div class="label">Admission No.</div>
            <div class="value">${cert.AdmissionNumber || ""}</div>
        </div>

        <div class="row">
            <div class="label">Student Name</div>
            <div class="value">${cert.StudentTitle || ""} ${cert.StudentName || ""}</div>
        </div>

        <div class="row">
            <div class="label">Father Name</div>
            <div class="value">${cert.FatherName || ""}</div>
        </div>

        <div class="row">
            <div class="label">Course</div>
            <div class="value">
                ${[
                    cert.Course1,
                    cert.Course2,
                    cert.Course3
                ].filter(Boolean).join(", ")}
            </div>
        </div>

        <div class="row">
            <div class="label">Course Duration</div>
            <div class="value">${cert.CourseDuration || ""}</div>
        </div>

        <div class="row">
            <div class="label">Marks</div>
            <div class="value">
                ${cert.MarksObtained || ""} / ${cert.TotalMarks || ""}
            </div>
        </div>

        <div class="row">
            <div class="label">Percentage</div>
            <div class="value">${cert.Percentage || ""}</div>
        </div>

        <div class="row">
            <div class="label">Grade</div>
            <div class="value">${cert.Grade || ""}</div>
        </div>

        <div class="row">
            <div class="label">Issue Date</div>
            <div class="value">${cert.IssueDate || ""}</div>
        </div>

        <div class="row">
            <div class="label">Status</div>
            <div class="value">${cert.Status || "VALID"}</div>
        </div>

    `;
}


async function verifyCertificate(){

    if(!certificateID){

        statusBox.className = "status invalid";

        statusBox.innerHTML =
            "❌ Certificate Number Missing";

        return;
    }

    try{

        const response = await fetch(
            API_URL +
            "?id=" +
            encodeURIComponent(certificateID)
        );

        const data = await response.json();

        if(data.success && data.certificate){

            statusBox.className = "status valid";

            statusBox.innerHTML =
                "✓ CERTIFICATE VERIFIED — VALID";

            showDetails(data.certificate);

        }else{

            statusBox.className = "status invalid";

            statusBox.innerHTML =
                "❌ CERTIFICATE NOT FOUND";

            detailsBox.innerHTML =
                "<p style='text-align:center'>No certificate record was found for this certificate number.</p>";

        }

    }catch(error){

        statusBox.className = "status invalid";

        statusBox.innerHTML =
            "⚠ Verification Server Error";

        detailsBox.innerHTML =
            "<p style='text-align:center'>Please try again later.</p>";

        console.error(error);

    }
}


verifyCertificate();

</script>

</body>
</html>
