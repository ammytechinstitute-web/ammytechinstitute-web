<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMMYTECH Certificate Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.10);
}

.header {
    text-align: center;
    border-bottom: 2px solid #ddd;
    padding-bottom: 20px;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 8px 0 0;
    color: #555;
}

.status {
    text-align: center;
    padding: 15px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 25px;
}

.valid {
    background: #dff5e3;
    color: #167534;
}

.invalid {
    background: #fde2e2;
    color: #b00020;
}

.loading {
    text-align: center;
    font-size: 18px;
    padding: 30px;
}

.details {
    width: 100%;
    border-collapse: collapse;
}

.details tr {
    border-bottom: 1px solid #ddd;
}

.details td {
    padding: 12px 8px;
}

.details td:first-child {
    font-weight: bold;
    width: 40%;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

.error {
    text-align: center;
    color: #b00020;
    font-size: 18px;
    padding: 20px;
}

@media (max-width: 600px) {
    .container {
        margin: 15px auto;
        padding: 10px;
    }

    .card {
        padding: 20px;
    }

    .header h1 {
        font-size: 23px;
    }

    .details td {
        padding: 10px 5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>AMMYTECH COMPUTER INSTITUTE</h1>
            <p>Learn • Practice • Grow</p>
            <p>Certificate Verification</p>
        </div>

        <div id="result">
            <div class="loading">
                Verifying Certificate...
            </div>
        </div>

        <div class="footer">
            <strong>AMMYTECH COMPUTER INSTITUTE</strong><br>
            Ablowal, Back Side Thapar University,<br>
            Near Fateh Medical Store, Patiala<br>
            Phone: 9999949313<br>
            Email: ammytechinstitute@gmail.com
        </div>

    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwnHXcGldTUg2AmMajb8ZjTah0NSA93fqdq6_UkShj3FoKNVnR-NaHbUywBdDO6VkQmUg/exec";

const params = new URLSearchParams(window.location.search);

const certificateID = params.get("id");

const resultBox = document.getElementById("result");


function showCertificate(certificate) {

    resultBox.innerHTML = `

        <div class="status valid">
            ✓ CERTIFICATE VERIFIED — VALID
        </div>

        <table class="details">

            <tr>
                <td>Certificate Number</td>
                <td>${certificate.CertificateNumber || "-"}</td>
            </tr>

            <tr>
                <td>Admission Number</td>
                <td>${certificate.AdmissionNumber || "-"}</td>
            </tr>

            <tr>
                <td>Issue Date</td>
                <td>${certificate.IssueDate || "-"}</td>
            </tr>

            <tr>
                <td>Student Name</td>
                <td>${certificate.StudentTitle || ""} ${certificate.StudentName || "-"}</td>
            </tr>

            <tr>
                <td>Father Name</td>
                <td>${certificate.FatherName || "-"}</td>
            </tr>

            <tr>
                <td>Course</td>
                <td>${certificate.Course1 || "-"}</td>
            </tr>

            <tr>
                <td>Course Duration</td>
                <td>${certificate.CourseDuration || "-"}</td>
            </tr>

            <tr>
                <td>Total Marks</td>
                <td>${certificate.TotalMarks || "-"}</td>
            </tr>

            <tr>
                <td>Marks Obtained</td>
                <td>${certificate.MarksObtained || "-"}</td>
            </tr>

            <tr>
                <td>Percentage</td>
                <td>${certificate.Percentage || "-"}</td>
            </tr>

            <tr>
                <td>Grade</td>
                <td>${certificate.Grade || "-"}</td>
            </tr>

            <tr>
                <td>Status</td>
                <td><strong>${certificate.Status || "VALID"}</strong></td>
            </tr>

        </table>
    `;
}


function showNotFound(message) {

    resultBox.innerHTML = `

        <div class="status invalid">
            ✗ CERTIFICATE NOT FOUND
        </div>

        <div class="error">
            ${message || "This certificate could not be verified."}
            <br><br>
            Please check the Certificate Number.
        </div>

    `;
}


async function verifyCertificate() {

    if (!certificateID) {

        showNotFound("Certificate ID is missing.");

        return;
    }

    try {

        const url =
            API_URL +
            "?id=" +
            encodeURIComponent(certificateID);

        const response = await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Server Error: " + response.status
            );

        }

        const data = await response.json();

        console.log("Certificate API Response:", data);

        if (
            data.success === true &&
            data.certificate
        ) {

            showCertificate(data.certificate);

        } else {

            showNotFound(
                data.message || "Certificate not found."
            );

        }

    } catch (error) {

        console.error(error);

        resultBox.innerHTML = `

            <div class="status invalid">
                ✗ VERIFICATION ERROR
            </div>

            <div class="error">
                Certificate verification server could not be reached.
                <br><br>
                Please try again later.
            </div>

        `;
    }
}


verifyCertificate();

</script>

</body>
</html>
